name: ci

on:
  push:
    branches: [main]
  pull_request:
  # 실행이 GitHub 장애로 멈추면 재실행·취소가 모두 막힌다. 코드 변경 없이 새 실행을 만드는 통로.
  # deploy 잡은 ref 로 거르므로 main 에서 실행할 때만 배포한다 (gh workflow run ci --ref main).
  workflow_dispatch:

# 연속 푸시 때 배포가 겹치면 옛 이미지가 나중에 올라갈 수 있다. 앞 실행을 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
  IMAGE: ghcr.io/${{ github.repository_owner }}/tech-radar

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run pytest

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # latest 만 올리면 되돌릴 이미지가 없다. SHA 태그를 같이 남겨 롤백 대상을 만든다.
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
      - name: Deploy to VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e
            mkdir -p ~/tech-radar && cd ~/tech-radar
            # compose·Caddyfile 의 원본은 레포다. VM 에만 두면 조용히 어긋난다.
            # 배포하는 SHA 로 고정해 이미지와 설정이 같은 커밋에서 오도록 한다 (public 레포라 인증 불필요).
            # 먼저 임시 파일로 받는다. 운영 파일에 곧바로 쓰면 전송이 끊길 때 반토막으로 남는다.
            base="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}"
            curl -fsSL -o compose.new "$base/docker-compose.yml"
            curl -fsSL -o caddy.new "$base/Caddyfile"
            # compose 는 호스트의 docker 가 읽는다. 원자적 교체가 맞다.
            mv compose.new docker-compose.yml
            # Caddyfile 은 컨테이너에 "파일"로 바인드돼 inode 가 고정이다. mv 로 갈아치우면 실행 중인
            # caddy 는 옛 inode 를 계속 보고 뒤의 reload 가 헛돈다. 같은 inode 에 내용만 덮어쓴다.
            # truncate 먼저라 원자적이지 않지만, 40바이트 한 번 쓰기이고 아래 reload 가 곧 검증한다.
            # 반토막이면 배포가 실패하고 caddy 는 메모리에 올린 옛 설정으로 계속 서비스한다.
            cat caddy.new > Caddyfile && rm caddy.new
            docker compose pull
            # --wait 는 healthcheck 통과까지 기다리고 실패하면 0 이 아닌 코드를 낸다.
            if ! docker compose up -d --wait --wait-timeout 150; then
              docker compose logs --tail 80 app
              exit 1
            fi
            # Caddyfile 은 바인드 마운트라 내용이 바뀌어도 compose 가 caddy 를 재생성하지 않는다.
            # 무중단 reload 를 건다. Caddyfile 이 잘못됐으면 여기서 배포가 실패한다.
            docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile
            docker image prune -f

services:
  app:
    build: .
    # 롤백: VM 에서 `IMAGE_TAG=<커밋SHA> docker compose pull && IMAGE_TAG=<커밋SHA> docker compose up -d --wait`.
    # CI 는 IMAGE_TAG 를 주지 않아 latest 로 돌아온다.
    image: ghcr.io/${GHCR_OWNER:-local}/tech-radar:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    # Caddy 뒤라 uvicorn 이 X-Forwarded-* 를 믿어야 끝 슬래시 리다이렉트가 https 로, 로그 IP 가
    # 실제 클라이언트로 나온다. app 포트는 expose 만 해 Caddy 밖에서 닿지 않으므로 전부 믿어도 된다.
    # Dockerfile CMD(sh -c 문자열)에 옵션으로 넣지 않는다. 따옴표를 빠뜨리면 * 가 글롭으로 풀린다.
    environment:
      FORWARDED_ALLOW_IPS: "*"
    expose:
      - "8000"
    # 배포 잡이 `up -d --wait` 로 이 판정을 기다린다. 컨테이너가 죽어도 배포가 초록색이면 안 된다.
    # slim 이미지에 curl 이 없어 python 으로 확인한다. 2xx 가 아니면 urlopen 이 예외를 낸다.
    # start_period 는 시작 시 alembic upgrade 와 Neon 콜드 스타트를 감당할 만큼 둔다.
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    # 기본 json-file 드라이버는 한도가 없어 몇 달이면 디스크를 채운다.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:

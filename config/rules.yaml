# 검증 파이프라인 정책. 관문 순서: stale → 중복 → exclude → LLM 선별 → 점수 → LLM 판정 → 발송.
# 키워드 목록은 관문이 아니다. 선별·판정 프롬프트가 아래 policy 를 문장으로 읽는다.

policy:
  interests: |
    - AI 시스템 개발자. LLM 애플리케이션·에이전트·MCP 를 직접 만든다.
    - 주력 스택: Python(FastAPI, SQLAlchemy, Pydantic), Postgres, Docker, TypeScript/Next.js.
    - 관심: 새 모델 출시와 가격·컨텍스트 변화, 에이전트·RAG 기법, MCP 서버와 개발 도구,
      쓰는 라이브러리의 메이저 릴리즈, 개발 생태계의 정책·가격 변화.
  not_interested: |
    - 채용·홍보·입문자용 튜토리얼·이미 널리 알려진 일반론.
    - 특정 종목·투자 도구처럼 개발과 무관한 금융 콘텐츠.
  # "특히 주목" 힌트. 프롬프트에 그대로 들어간다.
  focus_repos:
    - anthropics/*
    - modelcontextprotocol/*
    - langchain-ai/*
    - astral-sh/*
    - vercel/next.js
    - fastapi/fastapi
    - pydantic/pydantic
  focus_stack: [claude, mcp, langgraph, fastapi, pydantic, sqlalchemy, postgres, next.js, uv, ruff]
  # 선별 topics 분류표 (slug). 순서가 앱 관심사 화면 순서다. 라벨은 config/app.yaml 에 있다.
  taxonomy:
    - llm-model
    - agent
    - mcp-tooling
    - inference-opt
    - rag-retrieval
    - training-finetune
    - python-backend
    - web-frontend
    - devops-infra
    - ai-safety-eval
    - dev-community
    - video
  # 앱 관심사 화면에서 고른 taxonomy 부분집합 (categories). 생략하면 taxonomy 전체다.
  # 거름망이 아니라 선별·판정 프롬프트의 힌트이며, 값은 앱이 user_prefs 에 덮어쓴다.

# 싸고 정확한 제외 규칙만 남긴다. exclude 는 언제나 우선한다.
exclude:
  keywords: [hiring, "we're hiring", giveaway, webinar, sponsored, "discount code", 채용, 광고]
  domains: []

# 벡터 유사도 임계값. 중복(≥dup)은 생존 항목만 기준, 관련(≥related)은 상태 무관.
# 2026-09-06 보정: 0.90~0.95 는 전부 다른 사건(같은 채널의 다른 영상 0.93, 다른 릴리즈 0.91)이라
# 중복은 0.96. 0.80~0.85 는 arXiv 두 피드의 주제 이웃 2,415쌍이라 관련은 0.88.
dedupe:
  dup_threshold: 0.96
  related_threshold: 0.88
  window_hours: 72

# LLM 선별 배치. 25건을 한 호출에 넣고 관련도 0~1 을 받는다.
triage:
  batch_size: 25
  daily_cap_calls: 60
  # 대기 항목이 min_batch 건 모이거나 가장 오래된 항목이 max_wait_minutes 를 기다리면 부른다.
  # 2026-09-18 실측: 매 실행 호출은 중앙값 2건이라 60회가 08:44 에 소진됐다.
  # 72시간 도착 시각 시뮬레이션에서 10건·60분은 하루 29~36회, 대기 p90 31분.
  min_batch: 10
  max_wait_minutes: 60

scoring:
  # 2026-09-10 조정 0.25/0.25 → 0.20/0.30. 신뢰도 0.5 인 arXiv 는 관련도 0.83 부터 통과한다
  # (실측 0.8 대 28건/2.5일). 0.9 만 통과하던 때는 3일간 1건뿐이었다.
  w_src: 0.20
  w_rel: 0.30
  w_hot: 0.2
  w_multi: 0.2
  w_fresh: 0.1
  threshold: 0.45
  max_age_hours: 72
  # 선별이 매긴 kind 별 가점·감점. 곱이 아니라 그대로 더한다. 0 이면 영향 없음.
  # 감점만 둔다. 2026-09-09 실측: technique +0.10 은 arXiv 154건/2.5일을 판정으로 보낸다.
  # release_patch 감점은 신뢰도 1.0 소스에서 관련도 1.0 을 요구하게 되어 두지 않는다.
  kind_weights:
    release_major: 0.0
    release_patch: 0.0
    technique: 0.0
    survey: -0.15
    news: 0.0
    tutorial: -0.05
    promo: -0.30
    other: 0.0

notify:
  daily_push_cap: 15
  quiet_start_hour: 23
  quiet_end_hour: 8
  timezone: Asia/Seoul
  explore_judge_cap: 3
  # 같은 cluster_id 를 하루(달력일)에 보내는 서로 다른 항목 수 상한. 0 = 끔.
  cluster_daily_cap: 1
  # importance 구간(high 5·4, mid 3, low 2·1) → 알림 강도 instant | quiet | feed_only.
  delivery_by_importance:
    high: instant
    mid: quiet
    low: feed_only
  explore_enabled: true
  # 발송 채널 on/off. 연결 정보(.env)가 없는 채널은 앱에서 켤 수 없다.
  channels:
    fcm: true
    discord: true
    telegram: false

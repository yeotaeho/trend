include_keywords:
  # 모델·LLM
  - claude
  - gpt
  - gemini
  - llama
  - mistral
  - qwen
  - deepseek
  - llm
  - 에이전트
  - agent
  - reasoning
  # 도구·프로토콜
  - mcp
  - model context protocol
  - langchain
  - langgraph
  - rag
  - vector
  - embedding
  - fine-tuning
  - prompt
  # 스택
  - python
  - fastapi
  - pydantic
  - sqlalchemy
  - postgres
  - next.js
  - react
  - typescript
  - docker
  - kubernetes
  - uv
  - ruff

include_repos:
  - anthropics/*
  - modelcontextprotocol/*
  - langchain-ai/*
  - astral-sh/*
  - vercel/next.js
  - fastapi/fastapi
  - pydantic/pydantic

exclude_keywords:
  - hiring
  - we're hiring
  - giveaway
  - webinar
  - sponsored
  - discount code
  - 채용
  - 광고

exclude_domains: []

# 이 소스들은 키워드 매칭 없이 규칙 관문을 통과한다.
always_pass_sources:
  - github_release:*
  - youtube:*

# LLM 프롬프트에 고정으로 넣는 사용자 관심 스택.
interests: |
  - AI 시스템 개발자. LLM 애플리케이션·에이전트·MCP 를 직접 만든다.
  - 주력 스택: Python(FastAPI, SQLAlchemy, Pydantic), Postgres, Docker, TypeScript/Next.js.
  - 관심: 새 모델 출시와 가격·컨텍스트 변화, 에이전트·RAG 기법, MCP 서버와 개발 도구,
    쓰는 라이브러리의 메이저 릴리즈, 개발 생태계의 정책·가격 변화.
  - 관심 없음: 채용·홍보·입문자용 튜토리얼·이미 널리 알려진 일반론.

scoring:
  w_src: 0.25
  w_kw: 0.25
  w_hot: 0.2
  w_multi: 0.2
  w_fresh: 0.1
  threshold: 0.45

notify:
  daily_push_cap: 15
  quiet_start_hour: 23
  quiet_end_hour: 8
  timezone: Asia/Seoul

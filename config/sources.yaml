# config 의 display_name·error_hint 는 앱 수집 소스 화면 표시용이다. 수집기는 읽지 않는다.
# error_hint 는 연속 실패일 때 보여 줄 조치 문구.
sources:
  # --- 기업·재단 기술 블로그 (RSS) ---
  # Anthropic 은 공식 RSS 가 없다 (/news/rss.xml 404). 커뮤니티 미러를 쓴다.
  # 미러가 끊기면 fail_count 5회에 운영 알림이 온다. 본문은 anthropic.com 원문에서 보강.
  - name: rss:anthropic
    type: rss
    config:
      display_name: Anthropic
      error_hint: 미러 확인 필요
      url: https://raw.githubusercontent.com/Olshansk/rss-feeds/main/feeds/feed_anthropic_news.xml
      allowed_hosts: [anthropic.com]   # 미러가 넣은 외부 링크는 버린다
    poll_interval_sec: 900
    trust_score: 1.0

  - name: rss:openai
    type: rss
    config:
      display_name: OpenAI
      url: https://openai.com/news/rss.xml
    poll_interval_sec: 900
    trust_score: 0.9

  - name: rss:huggingface
    type: rss
    config:
      display_name: Hugging Face
      url: https://huggingface.co/blog/feed.xml
    poll_interval_sec: 900
    trust_score: 0.8

  - name: rss:vercel
    type: rss
    config:
      display_name: Vercel
      url: https://vercel.com/atom
    poll_interval_sec: 1800
    trust_score: 0.7

  # --- 커뮤니티·개인 블로그 (RSS) ---
  - name: rss:geeknews
    type: rss
    config:
      display_name: GeekNews
      url: https://news.hada.io/rss/news
    poll_interval_sec: 900
    trust_score: 0.6

  - name: rss:yozm
    type: rss
    config:
      display_name: 요즘IT
      url: https://yozm.wishket.com/magazine/feed/
    poll_interval_sec: 1800
    trust_score: 0.5

  - name: rss:simonwillison
    type: rss
    config:
      display_name: Simon Willison
      url: https://simonwillison.net/atom/everything/
    poll_interval_sec: 900
    trust_score: 0.8

  # rss:anthropic 과 같은 커뮤니티 미러의 engineering 피드. 외부 링크는 버린다.
  - name: rss:anthropic-engineering
    type: rss
    config:
      display_name: Anthropic Engineering
      error_hint: 미러 확인 필요
      url: https://raw.githubusercontent.com/Olshansk/rss-feeds/main/feeds/feed_anthropic_engineering.xml
      allowed_hosts: [anthropic.com]
    poll_interval_sec: 900
    trust_score: 1.0

  # --- arXiv (하루 1회 갱신이라 1시간 주기면 충분) ---
  # 같은 family 는 적재 병합에서 같은 소스로 본다. 교차 등재 논문이 multi 신호를 만들지 않게.
  # 적재 병합에만 적용된다. dedupe 의 관련 판정은 별개다.
  - name: rss:arxiv-cs-ai
    type: rss
    config:
      display_name: arXiv cs.AI
      url: https://rss.arxiv.org/rss/cs.AI
      category_hint: technique
      family: arxiv
    poll_interval_sec: 3600
    trust_score: 0.5

  - name: rss:arxiv-cs-cl
    type: rss
    config:
      display_name: arXiv cs.CL
      url: https://rss.arxiv.org/rss/cs.CL
      category_hint: technique
      family: arxiv
    poll_interval_sec: 3600
    trust_score: 0.5

  # --- Hugging Face Daily Papers (큐레이션 10~30건/일. arXiv URL 로 적재돼 위 arXiv 항목에 upvotes 가 병합된다) ---
  - name: hf_papers:daily
    type: hf_papers
    config:
      display_name: HF Daily Papers
      limit: 50
    poll_interval_sec: 3600
    trust_score: 0.7

  # --- GitHub Releases (웹훅이 주 경로, 이 폴링은 누락 보정) ---
  - name: github_release:watchlist
    type: github_release
    config:
      display_name: GitHub Releases
      repos:
        - anthropics/anthropic-sdk-python
        - anthropics/claude-code
        - modelcontextprotocol/servers
        - modelcontextprotocol/python-sdk
        - langchain-ai/langgraph
        - vercel/next.js
        - fastapi/fastapi
        - pydantic/pydantic
        - astral-sh/uv
        - astral-sh/ruff
      per_page: 20
    poll_interval_sec: 1800
    trust_score: 1.0

  # --- Hacker News (프론트 페이지 = 커뮤니티가 고른 30건. 링크 글은 원문 URL 로 적재돼 기존 항목과 병합) ---
  - name: hackernews:front
    type: hackernews
    config:
      display_name: Hacker News
      hits_per_page: 30
    poll_interval_sec: 600
    trust_score: 0.6

  # --- YouTube 채널 ---
  - name: youtube:jocoding
    type: youtube
    config:
      display_name: 조코딩
      channel_id: UCQNE2JmbasNYbjGAcuBiRRg
    poll_interval_sec: 900
    trust_score: 0.6

  - name: youtube:codingapple
    type: youtube
    config:
      display_name: 코딩애플
      channel_id: UCSLrpBAzr-ROVGHQ5EmxnUg
    poll_interval_sec: 900
    trust_score: 0.6
